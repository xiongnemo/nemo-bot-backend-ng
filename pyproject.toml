[project]
name = "nemo-bot-backend-ng"
version = "0.1.0"
description = "Agentic chatbot backend for nemo-bot"
requires-python = ">=3.11"

dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pytz>=2024.1",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "pyyaml>=6.0.3",
    "concurrent-log-handler>=0.9.29",
    "sqlalchemy>=2.0.51",
    "asteval>=1.0.9",
    "flightradarapi>=1.5",
    "dnspython>=2.4",
    "mdit-py-plugins>=0.4.0",
    "emoji>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "core",
    "nemollm",
    "routing",
    "runtime",
    "store",
    "agent",
    "scheduler",
    "adapters",
    "plugins",
    "classes",
]
dev-mode-dirs = ["."]
